<!doctype html>
<html lang="pt-ao">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="cartao.css" />
    <title>Cartão de Perfil</title>
    <link
      rel="stylesheet"
      href="https://cdn.hugeicons.com/font/hgi-stroke-rounded.css"
    />
  </head>
  <body>
    <div class="container">
      <section class="card">
        <div class="imag">
          <img src="./imags/Cartaonivel1.jpg" alt="cão" />

            <h3>Bernado da Silva</h3>
          </div>
          <div class="profissao">

        <footer class="redeSocial">

            <img
              src="./imags/whatsapp-business-stroke-rounded (1).svg"
              alt=""
            />

          </div>
          <div>
            <img src="./imags/instagram-stroke-rounded.svg" alt="" />
            <p>Instagram</p>
          </div>
          <div>
            <img src="./imags/facebook-02-stroke-rounded.svg" alt="" />
            <p>Facebook</p>
          </div>
        </footer>
      </section>
    </div>
